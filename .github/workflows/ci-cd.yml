name: WonderAI Continuous Integration

# 1. Trigger the workflow on every push or PR to the main branch
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # JOB 1: Test and Validate the FastAPI Backend
  backend-ci:
    runs-on: ubuntu-latest # Running on standard cloud Ubuntu environments

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Automatically caches dependencies for faster builds

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest httpx

      - name: Run Code Linting (Check Formatting)
        run: |
          pip install flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      # Run tests (Uncomment when you have test scripts configured in /tests)
      # - name: Run Backend Tests
      #   run: |
      #     cd backend && pytest

  # JOB 2: Build & Verify Docker Containers
  docker-build-verify:
    needs: backend-ci # Only run this job if tests and linting pass successfully
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verifies that both Dockerfiles can compile cleanly without pushing them yet
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: wonderai-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: wonderai-frontend:test
