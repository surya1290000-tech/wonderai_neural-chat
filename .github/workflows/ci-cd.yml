name: WonderAI Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # JOB 1: Test and Validate the FastAPI Backend
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lightweight CI Dependencies
        # Uses requirements-ci.txt (no torch/faiss/sentence-transformers)
        # This cuts install time from ~8min to ~30sec
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt

      - name: Run Code Linting
        run: |
          pip install flake8
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Smoke Tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "test_jwt_secret_key_for_ci_pipeline"
          GEMINI_API_KEY: "test_dummy_gemini_api_key"
          OPENAI_API_KEY: "test_dummy_openai_api_key"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          AI_PROVIDER: "gemini"
        run: |
          cd backend && python -m pytest tests/test_ci_smoke.py -v --tb=short

  # JOB 2: Build & Verify Docker Containers
  docker-build-verify:
    needs: backend-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: wonderai-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: wonderai-frontend:test

  # JOB 3: Push to Azure Container Registry & Deploy to AKS
  # Only runs on push to main. Requires AZURE_CREDENTIALS secret.
  deploy-to-kubernetes:
    needs: docker-build-verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name wonderaicr9872

      - name: Build and Push Backend Image to ACR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            wonderaicr9872.azurecr.io/wonderai-backend:v1.0
            wonderaicr9872.azurecr.io/wonderai-backend:${{ github.sha }}

      - name: Build and Push Frontend Image to ACR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            wonderaicr9872.azurecr.io/wonderai-frontend:v1.0
            wonderaicr9872.azurecr.io/wonderai-frontend:${{ github.sha }}
