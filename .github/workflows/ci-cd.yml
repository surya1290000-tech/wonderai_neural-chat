name: WonderAI Continuous Integration

# 1. Trigger the workflow on every push or PR to the main branch
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # JOB 1: Test and Validate the FastAPI Backend
  backend-ci:
    runs-on: ubuntu-latest # Running on standard cloud Ubuntu environments

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Automatically caches dependencies for faster builds

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest httpx

      - name: Run Code Linting (Check Formatting)
        run: |
          pip install flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Tests
        run: |
          pip install pytest-asyncio anyio
          cd backend && pytest

  # JOB 2: Build & Verify Docker Containers
  docker-build-verify:
    needs: backend-ci # Only run this job if tests and linting pass successfully
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verifies that both Dockerfiles can compile cleanly without pushing them yet
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: wonderai-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: wonderai-frontend:test

  # JOB 3: Push to Registry and Deploy to Kubernetes
  deploy-to-kubernetes:
    needs: docker-build-verify # Only runs if the previous build tests pass
    runs-on: ubuntu-latest
    # We only want to deploy when pushing to main or master, not on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/wonderai-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/wonderai-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/wonderai-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/wonderai-frontend:${{ github.sha }}

      # This step assumes you have added your Kubeconfig to GitHub Secrets
      - name: Deploy to Kubernetes Cluster
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: |
            apply -f kubernetes/backend-deployment.yaml
            apply -f kubernetes/frontend-deployment.yaml
            rollout restart deployment/wonderai-backend
            rollout restart deployment/wonderai-frontend

