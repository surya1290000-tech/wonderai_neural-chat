apiVersion: v1
kind: Secret
metadata:
  name: wonderai-secrets
  labels:
    app: wonderai
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres_secure_password@db:5432/wonderai"
  POSTGRES_PASSWORD: "postgres_secure_password"
  SECRET_KEY: "replace_with_production_jwt_secret_key"
  OPENAI_API_KEY: "your-openai-api-key"
  GEMINI_API_KEY: "your-gemini-api-key"
