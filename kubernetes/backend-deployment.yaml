apiVersion: apps/v1
kind: Deployment
metadata:
  name: wonderai-backend
  labels:
    app: wonderai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wonderai-backend
  template:
    metadata:
      labels:
        app: wonderai-backend
    spec:
      containers:
        - name: backend
          image: wonderaicr9872.azurecr.io/wonderai-backend:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: wonderai-config
            - secretRef:
                name: wonderai-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: wonderai-backend
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: wonderai-backend
