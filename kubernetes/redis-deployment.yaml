apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: wonderai-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wonderai-redis
  template:
    metadata:
      labels:
        app: wonderai-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: wonderai-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: wonderai-redis
