apiVersion: v1
kind: ConfigMap
metadata:
  name: wonderai-config
  labels:
    app: wonderai
data:
  AI_PROVIDER: "gemini"
  GEMINI_DEFAULT_MODEL: "gemini-flash-latest"
  JWT_ALGORITHM: "HS256"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPM: "120"
  RATE_LIMIT_CHAT_RPM: "40"
  RATE_LIMIT_IMAGE_RPM: "10"
  RATE_LIMIT_AUTH_RPM: "15"
  ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:80","http://localhost"]'
  REDIS_URL: "redis://redis:6379/0"
  ENABLE_2FA: "true"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"
