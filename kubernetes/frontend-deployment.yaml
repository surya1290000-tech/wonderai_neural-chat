apiVersion: apps/v1
kind: Deployment
metadata:
  name: wonderai-frontend
  labels:
    app: wonderai-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wonderai-frontend
  template:
    metadata:
      labels:
        app: wonderai-frontend
    spec:
      containers:
        - name: frontend
          image: wonderai-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: wonderai-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: wonderai-frontend
